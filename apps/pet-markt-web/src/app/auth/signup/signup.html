<div class="max-w-md mx-auto">
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">Sign Up</h2>

      <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-4">
        <div class="form-control">
          <label for="emailInput" class="label">
            <span class="label-text">Email</span>
          </label>
          <input
            #emailInput
            id="emailInput"
            type="email"
            name="email"
            required
            (input)="email = emailInput.value"
            class="input input-bordered"
          />
        </div>

        <div class="form-control">
          <label for="passwordInput" class="label">
            <span class="label-text">Password</span>
          </label>
          <input
            #passwordInput
            id="passwordInput"
            type="password"
            name="password"
            required
            minlength="6"
            (input)="password = passwordInput.value"
            class="input input-bordered"
          />
        </div>

        <div class="form-control mt-6">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!email || !password || password.length < 6"
          >
            Sign Up
          </button>
        </div>
      </form>

      <div class="divider">OR</div>

      <button class="btn btn-outline w-full" (click)="signupWithGoogle()">
        Continue with Google
      </button>

      <p class="text-center mt-4">
        Already have an account?
        <a routerLink="/auth/login" class="link link-primary">Login</a>
      </p>
    </div>
  </div>
</div>
