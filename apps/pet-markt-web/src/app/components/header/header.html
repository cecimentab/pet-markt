<header class="bg-primary text-primary-content sticky top-0 z-50">
  <div class="container mx-auto px-4 py-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold">
      <a class="w-full h-full block" routerLink="/">Pet E-commerce</a>
    </h1>
    <nav>
      <ul class="flex space-x-4 items-center">
        <li><a routerLink="/" class="hover:underline">Home</a></li>
        <li><a routerLink="/products" class="hover:underline">Products</a></li>
        <li>
          <a
            routerLink="/cart"
            class="cart-icon relative inline-flex inline-block rounded-full p-4 bg-purple-400 text-white text-sm"
            [class.animate-bounce]="isCartBouncing()"
          >
            <div>
              <svg
                width="20px"
                height="20px"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <g clip-path="url(#clip0_15_35)">
                  <rect width="24" height="24" />
                  <path
                    d="M5.33331 6H19.8672C20.4687 6 20.9341 6.52718 20.8595 7.12403L20.1095 13.124C20.0469 13.6245 19.6215 14 19.1172 14H16.5555H9.44442H7.99998"
                    stroke="#000000"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M2 4H4.23362C4.68578 4 5.08169 4.30341 5.19924 4.74003L8.30076 16.26C8.41831 16.6966 8.81422 17 9.26638 17H19"
                    stroke="#000000"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="10"
                    cy="20"
                    r="1"
                    stroke="#000000"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="17.5"
                    cy="20"
                    r="1"
                    stroke="#000000"
                    stroke-linejoin="round"
                  />
                </g>
                <defs>
                  <clipPath id="clip0_15_35">
                    <rect width="24" height="24" fill="white" />
                  </clipPath>
                </defs>
              </svg>
            </div>
            <span>{{cartStore.totalItems()}}</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
