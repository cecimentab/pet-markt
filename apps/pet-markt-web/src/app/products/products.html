<div class="container mx-auto px-4">
  <div class="mb-4">
    <!-- search input -->
    <input
      type="text"
      placeholder="Search products..."
      class="input input-bordered w-full max-w-xs"
      [(ngModel)]="searchTerm"
    />
  </div>

  @if(productStore.loading()) {
  <div
    class="place-self-center flex flex-col max-w-md items-center gap-x-4 rounded-xl p-6"
  >
    <h1>Loading...</h1>
    <img src="loading.svg" alt="loading" />
  </div>
  } @else if (productStore.error()) {
  <div class="alert alert-error">
    <!-- error loading products -->
    <span>Error {{productStore.error()}}</span>
    <img src="error.png" alt="error" />
  </div>
  } @else if (productStore.products().length) {
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols3 lg:grid-cols-2 gap-6 auto-rows-fr"
  >
    <!-- Loop over products -->
    @for(product of productStore.products(); track product.id; let idx = $index)
    {
    <app-product-card
      (addToCart)="cartStore.addToCart($event) "
      [product]="product"
      [index]="idx"
    />
    }
    <!-- product card -->
  </div>
  }
</div>
